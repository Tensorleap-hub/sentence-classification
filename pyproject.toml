[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
numpy = ">=1.22.3,<2.0"
pandas = ">=2.0,<2.3"
sentencepiece = "^0.2.1"
torch = ">=2.5,<2.6"
onnx = ">=1.16,<1.18"
onnxruntime = ">=1.18,<1.20"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
